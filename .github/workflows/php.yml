name: PHP

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, tokenizer
      - name: Lint all PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: php tests/run.php
      - name: Check helper syntax
        run: |
          bash -n deploy-staging.sh deploy-live.sh deploy/install-server.sh tests/smoke.sh tests/deployment.sh
          python3 -m py_compile tests/fake_github_api.py
      - name: Run deployment tests
        run: tests/deployment.sh
      - name: Run HTTP smoke test
        run: tests/smoke.sh
